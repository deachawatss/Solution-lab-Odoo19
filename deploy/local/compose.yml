name: solution-lab-odoo19

services:
  db:
    image: postgres:latest
    container_name: solution-lab-odoo19-db
    restart: unless-stopped
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 5m
    volumes:
      - postgres-18-data:/var/lib/postgresql

  odoo:
    build:
      context: ../..
      dockerfile: deploy/local/Dockerfile
    container_name: solution-lab-odoo19-web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "8069:8069"
    volumes:
      - ../..:/opt/odoo
      - odoo-data:/var/lib/odoo
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8069/web/login >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 10m

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: solution-lab-odoo19-tunnel
    profiles:
      - cloudflare
    depends_on:
      odoo:
        condition: service_started
    env_file:
      - .env
    command: tunnel --no-autoupdate run
    restart: unless-stopped

volumes:
  postgres-18-data:
  odoo-data:
